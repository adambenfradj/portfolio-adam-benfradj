<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>AFTERLIFE — Portfolio d'Adam Ben Fradj</title>

  <!-- ===== Feuilles de style (ordre important) =====
       1. variables  : les tokens (couleurs, polices)
       2. base       : reset + styles de base
       3. layout     : mise en page générale (téléviseur, scène, décor)
       4. composants : morceaux réutilisables (carte-projet, navigation, modale) -->
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/composants/carte-projet.css" />
  <link rel="stylesheet" href="css/composants/navigation.css" />
  <link rel="stylesheet" href="css/composants/modale.css" />
  <meta name="robots" content="noindex, nofollow">
</head>
<body>

  <!-- ============================================================
       LE TÉLÉVISEUR : tout le site vit dans cet écran 16:9 bordé
       par le bezel métal « PORTFOLIO ».
       ============================================================ -->
  <div id="stage">
    <div id="tv">

      <!-- ===== ÉCRAN 0 : BOOT (logo + PRESS START) ===== -->
      <section id="boot" class="ecran">
        <div class="screen screen--boot">
          <img class="boot-logo" src="assets/images/logoafterlife.png" alt="AFTERLIFE" />
          <button id="btn-start" class="press-start"><span class="a">➯</span>PORTFOLIO</button>
          <p class="boot-copy">© 2026 Adam Ben Fradj </p>
        </div>
      </section>

      <!-- ===== ÉCRAN 1 : NOISE (grésillement de transition) ===== -->
      <section id="noise" class="ecran" hidden>
        <div class="screen">
          <video id="vid" src="assets/videos/tvnoise.mp4" muted playsinline preload="auto"></video>
        </div>
      </section>

      <!-- ===== ÉCRAN 2 : LE MONDE (scroll : projets → contact → logiciels) ===== -->
      <main id="monde" class="ecran" hidden>
        <div class="screen">
          <!-- Fond cathédrale qui défile à l'infini (tuilable) -->
          <div id="fond"></div>

          <!-- La scène : le personnage + les objets (TV, contact) qui défilent -->
          <div id="scene">
            <!-- Les TV-projets et le personnage de contact sont injectés ici par JS -->
            <div id="objets"></div>

            <!-- Le squelette (personnage principal), fixe : la caméra le suit -->
            <div id="perso"><img id="perso-img" src="assets/images/debout.png" alt="Personnage" /></div>

            <!-- Boîte de dialogue (texte écrit mot par mot) -->
            <div id="dialogue"><span class="fx">▶</span> <span id="dtext"></span></div>
            <div id="cue">défilez<br><span class="arrow">▼</span></div>
          </div>

          <!-- Section LOGICIELS : interface XMB (apparaît en fin de parcours) -->
          <div id="logiciels" aria-hidden="true">
            <video id="waves" src="assets/videos/psp_waves_background.mp4"
                   muted loop autoplay playsinline preload="auto"></video>
            <div class="xmb">
              <div class="xmb-row" id="xmbRow"></div>
              <div class="xmb-sel">
                <img class="xmb-memory" src="assets/images/memorycard.png" alt="Memory card" />
                <span id="xmbName">Maya</span>
                <span class="xmb-line"></span>
              </div>
            </div>
          </div>

          <!-- Barre de progression du scroll -->
          <div id="prog"><i></i></div>
        </div>
      </main>

      <!-- Le bezel métal « PORTFOLIO » par-dessus tout -->
      <img id="cadre-tv" src="assets/images/cadre_tv.png" alt="" aria-hidden="true" />
    </div>
  </div>

  <!-- ===== MODALE PROJET (fenêtre Media Player Classic) ===== -->
  <div class="modale" id="modale-projet" hidden>
    <div class="mpc">
      <div class="mpc-bar">
        <span class="mpc-bar-main"><span id="mpc-fichier">afterlife.wmv</span> — Media Player Classic</span>
        <button class="mpc-x" data-close aria-label="Fermer">✕</button>
      </div>
      <div class="mpc-menu"><span>File</span><span>View</span><span>Play</span><span>Navigate</span><span>Favorites</span><span>Help</span></div>
      <div class="mpc-video">
        <video id="mpc-video" preload="metadata" playsinline muted></video>
      </div>
      <div class="mpc-ctrl">
        <button class="mpc-btn" data-action="toggle" aria-label="Lecture / pause">▶</button>
        <button class="mpc-btn" data-action="prev" aria-label="Reculer de 5 s">⏮</button>
        <button class="mpc-btn" data-action="next" aria-label="Avancer de 5 s">⏭</button>
        <div class="mpc-track-wrap"><input id="mpc-range" type="range" min="0" max="100" step="0.1" value="0" aria-label="Progression vidéo" /></div>
        <span id="mpc-time">00:00 / 00:00</span>
      </div>
      <div class="mpc-corps" id="mpc-corps"></div>
    </div>
  </div>

  <!-- ===== MODALE CONTACT (fenêtre Paint avec coordonnées) ===== -->
  <div class="modale" id="modale-contact" hidden>
    <div class="paint">
      <button class="paint-x" data-close aria-label="Fermer">✕</button>
      <img src="assets/images/contact_face.png" alt="Contact — Adam Ben Fradj" />
      <div class="paint-liens">
        <a href="tel:+15147976782" aria-label="Téléphone"></a>
        <a href="mailto:benfradjadam@gmail.com" aria-label="Courriel"></a>
      </div>
    </div>
  </div>

  <p id="hint">molette / glisser pour avancer &nbsp;•&nbsp; ← → dans les logiciels &nbsp;•&nbsp; échap pour fermer</p>

  <!-- ===== Scripts (ordre important : données → composants → orchestrateur) ===== -->
  <script src="js/data.js"></script>
  <script src="js/composants/carte-projet.js"></script>
  <script src="js/composants/modale.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
